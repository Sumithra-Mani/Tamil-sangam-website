  quoteMeaning:{ en: "“Every town is our town, everyone is our kin” — Kaniyan Pungundranar, Purananuru", ta: "— கணியன் பூங்குன்றனார், புறநானூறு · “Every town is our town, everyone is our kin”" },
  p1t: { en: "Festivals",  ta: "பண்டிகைகள்" }, p1d: { en: "Pongal, Puthandu, Deepavali and community get-togethers.", ta: "பொங்கல், புத்தாண்டு, தீபாவளி மற்றும் சமூக ஒன்றுகூடல்கள்." },
  p2t: { en: "Language",   ta: "மொழி" },       p2d: { en: "Helping children learn to read, write and speak Tamil.", ta: "குழந்தைகள் தமிழ் படிக்கவும், எழுதவும், பேசவும் உதவுகிறோம்." },
  p3t: { en: "Arts",       ta: "கலைகள்" },     p3d: { en: "Music, dance, drama and performances by our members.", ta: "எம் உறுப்பினர்களின் இசை, நடனம், நாடகம் மற்றும் நிகழ்ச்சிகள்." },
  p4t: { en: "Community",  ta: "சமூகம்" },     p4d: { en: "Support and friendship for new and established families.", ta: "புதிய மற்றும் நீண்டகாலக் குடும்பங்களுக்கு ஆதரவும் நட்பும்." },
  statEvents:  { en: "Events celebrated", ta: "கொண்டாடிய நிகழ்வுகள்" },
  statYears:   { en: "Years of memories", ta: "ஆண்டுகளின் நினைவுகள்" },
  statVol:     { en: "Volunteer-run", ta: "தன்னார்வலர்களால் நடத்தப்படுகிறது" },

  eventsTitle: { en: "Our celebrations, year by year", ta: "ஆண்டுவாரியாக எங்கள் கொண்டாட்டங்கள்" },
  eventsLead:  { en: "Pick a year to see what we celebrated, then click any event to browse the photos.", ta: "ஓர் ஆண்டைத் தேர்ந்தெடுத்து, புகைப்படங்களைக் காண எந்த நிகழ்வையும் அழுத்துங்கள்." },
  photosSoon:  { en: "Photos coming soon", ta: "புகைப்படங்கள் விரைவில்" },
  photos:      { en: "photos", ta: "புகைப்படங்கள்" },

  contactTitle:{ en: "Get in touch", ta: "எங்களைத் தொடர்பு கொள்ளுங்கள்" },
  contactLead: { en: "Call, message us on WhatsApp, email, or follow us on social media — we'd love to hear from you.", ta: "அழையுங்கள், வாட்ஸ்அப்பில் செய்தி அனுப்புங்கள், மின்னஞ்சல் செய்யுங்கள், அல்லது சமூக ஊடகங்களில் எங்களைப் பின்தொடருங்கள் — உங்களிடமிருந்து கேட்க ஆவலாக உள்ளோம்." },
  callUs:   { en: "Call us", ta: "அழையுங்கள்" },

  facebook: { en: "Facebook", ta: "ஃபேஸ்புக்" },        fbSub:    { en: "Follow our page", ta: "எங்கள் பக்கத்தைப் பின்தொடருங்கள்" },

  subjects:  { en: ["Membership enquiry","Upcoming events","Volunteering","Sponsorship","Other"],
               ta: ["உறுப்பினர் சேர்க்கை விசாரணை","வரவிருக்கும் நிகழ்வுகள்","தன்னார்வப் பணி","நிதியுதவி / ஆதரவு","பிற"] },

<style>
  :root{
    --maroon:#7a1e2c; --maroon-dk:#4f1019; --gold:#e0a526; --gold-lt:#f6d98b;
    --cream:#fdf8ef; --ink:#2a1a14; --muted:#6d5a50; --line:#ead9c0;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:76px}
  body{font-family:Inter,"Noto Sans Tamil",system-ui,sans-serif;color:var(--ink);background:var(--cream);line-height:1.6}
  img{max-width:100%;display:block}
  a{color:inherit}
  .wrap{max-width:1150px;margin:auto;padding:0 22px}
  .tamil{font-family:"Noto Serif Tamil",serif}
  h1,h2,h3{font-family:"Playfair Display","Noto Serif Tamil",Georgia,serif;line-height:1.2}

  /* Tamil mode adjustments — Tamil words are longer, so sizes are eased down */
  html[lang="ta"] body{font-family:"Noto Sans Tamil",Inter,sans-serif;line-height:1.75}
  html[lang="ta"] h1,html[lang="ta"] h2,html[lang="ta"] h3{font-family:"Noto Serif Tamil",serif;line-height:1.4}
  html[lang="ta"] .slide h1{font-size:clamp(1.7rem,4vw,2.9rem)}
  html[lang="ta"] .sec-title{font-size:clamp(1.5rem,3vw,2.15rem)}
  html[lang="ta"] .eyebrow{letter-spacing:.02em;font-size:.88rem}
  html[lang="ta"] .menu a{font-size:.92rem;padding:9px 11px}
  html[lang="ta"] .brand b{font-family:"Noto Serif Tamil",serif;font-size:1rem}

  /* top strip */
  .topbar{background:var(--maroon-dk);color:#f3e3c7;font-size:.85rem}
  .topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 22px;flex-wrap:wrap}
  .topbar a{text-decoration:none;opacity:.9}.topbar a:hover{opacity:1;color:var(--gold-lt)}
  .topbar .contact a{margin-right:18px}

  /* social icons */
  .social{display:flex;gap:8px}
  .social a{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);transition:.2s}
  .social a:hover{background:var(--gold);color:var(--maroon-dk)}
  .social svg{width:16px;height:16px;fill:currentColor}

  /* nav */
  header{position:sticky;top:0;z-index:50;background:#fff;box-shadow:0 2px 14px rgba(80,20,20,.08)}
  nav{display:flex;align-items:center;justify-content:space-between;height:70px;gap:12px}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
  .logo{width:56px;height:56px;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(122,30,44,.18));transition:transform .3s}
  .logo img{width:100%;height:100%;display:block}
  .brand:hover .logo{transform:rotate(-6deg) scale(1.05)}
  .brand b{display:block;font-family:"Playfair Display",serif;font-size:1.15rem;color:var(--maroon);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{font-size:.78rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-right{display:flex;align-items:center;gap:10px}
  .menu{display:flex;gap:4px;list-style:none}
  .menu a{display:block;padding:9px 15px;border-radius:8px;text-decoration:none;font-weight:500;color:var(--ink);white-space:nowrap}
  .menu a:hover,.menu a.active{background:var(--cream);color:var(--maroon)}
  .burger{display:none;background:none;border:0;width:42px;height:42px;cursor:pointer}
  .burger span{display:block;height:2px;margin:6px 8px;background:var(--maroon)}

  /* language switch */
  .lang{display:flex;background:var(--cream);border:1.5px solid var(--line);border-radius:30px;padding:3px;flex-shrink:0}
  .lang button{border:0;background:none;padding:6px 13px;border-radius:24px;font:600 .85rem Inter,"Noto Sans Tamil",sans-serif;color:var(--muted);cursor:pointer;transition:.25s}
  .lang button.on{background:var(--maroon);color:#fff;box-shadow:0 2px 8px rgba(122,30,44,.3)}
  .lang button:not(.on):hover{color:var(--maroon)}
  .lang button[data-lang="ta"]{font-family:"Noto Sans Tamil",sans-serif}
  main,footer,header .brand{transition:opacity .2s}
  body.switching main,body.switching footer,body.switching header .brand{opacity:.25}

  /* hero slideshow */
  .hero{position:relative;height:min(78vh,620px);overflow:hidden;color:#fff}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;display:flex;align-items:center;background-size:cover;background-position:center}
  .slide.on{opacity:1}
  .slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(40,8,12,.82),rgba(40,8,12,.35) 70%,rgba(40,8,12,.15))}
  .slide .wrap{position:relative;z-index:2;width:100%}
  .slide h1{font-size:clamp(2rem,5vw,3.6rem);max-width:680px;margin-bottom:14px}
  .slide p{font-size:clamp(1rem,2vw,1.25rem);max-width:540px;opacity:.92;margin-bottom:28px}
  .slide.on h1,.slide.on p,.slide.on .btn{animation:rise .9s both}
  .slide.on p{animation-delay:.15s}.slide.on .btn{animation-delay:.3s}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .btn{display:inline-block;padding:13px 26px;border-radius:40px;background:var(--gold);color:var(--maroon-dk);font-weight:600;text-decoration:none;border:0;cursor:pointer;font-size:1rem;font-family:inherit;transition:.2s}
  .btn:hover{background:var(--gold-lt);transform:translateY(-2px)}
  .btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7);margin-left:10px}
  .dots{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
  .dots button{width:11px;height:11px;border-radius:50%;border:0;background:rgba(255,255,255,.45);cursor:pointer;transition:.3s}
  .dots button.on{background:var(--gold);width:30px;border-radius:6px}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:1.4rem;cursor:pointer;backdrop-filter:blur(4px)}
  .arrow:hover{background:rgba(255,255,255,.3)}.arrow.prev{left:18px}.arrow.next{right:18px}
  .bg0{background:radial-gradient(circle at 80% 30%,#c0392b 0,transparent 45%),linear-gradient(135deg,#7a1e2c,#3d0c14)}
  .bg1{background:radial-gradient(circle at 75% 40%,#e0a526 0,transparent 40%),linear-gradient(135deg,#8a3b12,#4f1019)}
  .bg2{background:radial-gradient(circle at 80% 35%,#1f7a6b 0,transparent 45%),linear-gradient(135deg,#0f3d3a,#3d0c14)}
  .bg3{background:radial-gradient(circle at 78% 35%,#9b2c6f 0,transparent 45%),linear-gradient(135deg,#5a1442,#2a0a12)}
  .kolam{position:absolute;right:6%;top:50%;transform:translateY(-50%);width:min(40vw,420px);opacity:.22;z-index:1}

  /* sections */
  section{padding:84px 0}
  .eyebrow{display:inline-block;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--maroon);font-weight:600;margin-bottom:10px}
  .sec-title{font-size:clamp(1.8rem,3.5vw,2.6rem);margin-bottom:14px;color:var(--maroon-dk)}
  .lead{color:var(--muted);max-width:640px;font-size:1.05rem}
  .center{text-align:center}.center .lead{margin:auto}

  /* about */
  .about-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center}
  .quote{margin-top:26px;padding:20px 24px;border-left:4px solid var(--gold);background:#fff;border-radius:0 var(--radius) var(--radius) 0}
  .quote .tamil{font-size:1.25rem;color:var(--maroon)}
  .quote small{color:var(--muted)}
  .pillars{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .pillar{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;transition:.25s}
  .pillar:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(122,30,44,.1)}
  .pillar .ic{font-size:1.7rem;margin-bottom:8px}
  .pillar h3{font-size:1.1rem;color:var(--maroon);margin-bottom:4px}
  .pillar p{font-size:.92rem;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:56px}
  .stat{background:var(--maroon);color:#fff;border-radius:var(--radius);padding:24px;text-align:center}
  .stat b{display:block;font-family:"Playfair Display",serif;font-size:2.2rem;color:var(--gold-lt)}

  /* events */
  #events{background:#fff}
  .years{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:34px 0 40px}
  .years button{padding:10px 24px;border-radius:30px;border:1.5px solid var(--line);background:var(--cream);font:600 1rem Inter,sans-serif;color:var(--ink);cursor:pointer;transition:.2s}
  .years button:hover{border-color:var(--gold)}
  .years button.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
  .ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:24px}
  .ev{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--cream);display:flex;flex-direction:column;animation:rise .5s both}
  .ev .cover{aspect-ratio:16/10;position:relative;cursor:pointer;overflow:hidden;background:linear-gradient(135deg,var(--maroon),#b5471f)}
  .ev .cover img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
  .ev .cover:hover img{transform:scale(1.06)}
  .ev .ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.85);text-align:center;font-size:.9rem}
  .ev .ph span{font-size:2.4rem;display:block}
  .ev .count{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.6);color:#fff;font-size:.8rem;padding:4px 11px;border-radius:20px}
  .ev .body{padding:20px 22px 24px;flex:1}
  .ev .meta{font-size:.82rem;color:var(--maroon);font-weight:600;margin-bottom:6px}
  .ev h3{font-size:1.25rem;margin-bottom:6px}
  .ev p{color:var(--muted);font-size:.94rem;margin-bottom:14px}
  .ev .view{background:none;border:0;color:var(--maroon);font:600 .92rem Inter,"Noto Sans Tamil",sans-serif;cursor:pointer;padding:0}
  .ev .view:hover{text-decoration:underline}

  /* lightbox */
  .lb{position:fixed;inset:0;background:rgba(15,4,6,.94);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
  .lb.open{display:flex}
  .lb img{max-height:78vh;max-width:92vw;border-radius:8px;box-shadow:0 20px 60px #000}
  .lb .cap{color:#f3e3c7;margin-top:14px;text-align:center}
  .lb .x{position:absolute;top:16px;right:22px;font-size:2.2rem;color:#fff;background:none;border:0;cursor:pointer}
  .lb .arrow{position:fixed}
  .thumbs{display:flex;gap:8px;margin-top:14px;overflow-x:auto;max-width:92vw}
  .thumbs img{width:64px;height:48px;object-fit:cover;opacity:.5;cursor:pointer;border-radius:4px;box-shadow:none}
  .thumbs img.on{opacity:1;outline:2px solid var(--gold)}

  /* contact */
  .contact-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;margin-top:40px}
  .cards{display:grid;gap:14px}
  .card{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;text-decoration:none;transition:.2s}
  .card:hover{border-color:var(--gold);transform:translateX(4px)}
  .card .ci{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;color:#fff}
  .card .ci svg{width:22px;height:22px;fill:currentColor}
  .card small{display:block;color:var(--muted);font-size:.8rem}
  .card b{font-weight:600;word-break:break-word}
  .c-phone{background:var(--maroon)}.c-mail{background:#c0392b}.c-wa{background:#25d366}.c-fb{background:#1877f2}.c-x{background:#111}.c-ig{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)}.c-yt{background:#ff0000}
  form{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:30px}
  form h3{color:var(--maroon);margin-bottom:18px;font-size:1.4rem}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  label{display:block;font-size:.85rem;font-weight:500;margin-bottom:5px}
  input,textarea,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--cream);margin-bottom:14px}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);background:#fff}
  textarea{min-height:120px;resize:vertical}
  .note{font-size:.8rem;color:var(--muted);margin-top:10px}

  /* footer */
  footer{background:var(--maroon-dk);color:#e9d6bd;padding:50px 0 24px}
  .f-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:36px}
  footer h4{font-family:"Playfair Display","Noto Serif Tamil",serif;color:var(--gold-lt);font-size:1.1rem;margin-bottom:12px}
  footer ul{list-style:none}footer li{margin-bottom:6px}
  footer a{text-decoration:none;opacity:.85}footer a:hover{opacity:1;color:var(--gold-lt)}
  .copy{border-top:1px solid rgba(255,255,255,.12);margin-top:36px;padding-top:18px;font-size:.85rem;text-align:center;opacity:.75}
  .wa-float{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.25);z-index:60;transition:.2s}
  .wa-float:hover{transform:scale(1.08)}
  .wa-float svg{width:30px;height:30px;fill:#fff}

  @media (max-width:980px){
    .menu{position:absolute;top:70px;left:0;right:0;background:#fff;flex-direction:column;padding:10px 16px 18px;box-shadow:0 10px 20px rgba(0,0,0,.08);display:none}
    .menu.open{display:flex}
    .burger{display:block}
    .about-grid,.contact-grid,.f-grid{grid-template-columns:1fr}
    .stats{grid-template-columns:1fr}
    .topbar .contact{display:none}
    .kolam{opacity:.12}
    .arrow.prev,.arrow.next{display:none}
    .lb .arrow{display:block}
  }
  @media (max-width:520px){
    .row,.pillars{grid-template-columns:1fr}.btn.ghost{margin:10px 0 0}
    .brand small{display:none}.logo{width:42px;height:42px}
    .brand b,html[lang="ta"] .brand b{white-space:normal;font-size:.92rem;line-height:1.2}
    .lang button{padding:6px 10px}
  }
</style>
</head>

          <li><a href="#home" data-t="home"></a></li><li><a href="#about" data-t="about"></a></li>
          <li><a href="#events" data-t="events"></a></li><li><a href="#contact" data-t="contact"></a></li>
        </ul>
      </div>
      <div>
        <h4 data-t="contactH"></h4>
        <ul>
          <li><a data-bind="phoneLink">📞 <span data-raw="phone"></span></a></li>
          <li><a data-bind="emailLink">✉️ <span data-raw="email"></span></a></li>
          <li><a data-bind="waLink" target="_blank" rel="noopener">💬 <span data-t="waUs"></span></a></li>
        </ul>
      </div>
    </div>
    <div class="copy">© <span id="yr"></span> <span data-site="name"></span>. <span data-t="madeBy"></span></div>
  </div>
</footer>

<a class="wa-float" data-bind="waLink" target="_blank" rel="noopener" aria-label="WhatsApp"></a>

<!-- Lightbox -->
<div class="lb" id="lb">
  <button class="x" aria-label="Close" onclick="closeLb()">×</button>
  <button class="arrow prev" onclick="lbGo(-1)">‹</button>
  <img id="lbImg" alt="">
  <button class="arrow next" onclick="lbGo(1)">›</button>
  <div class="cap" id="lbCap"></div>
  <div class="thumbs" id="lbThumbs"></div>
</div>

<script>
const ICON = {
  phone:'<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>',
  mail:'<svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/></svg>',
  wa:'<svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1l-.9 1.2c-.2.2-.3.2-.6.1a8 8 0 0 1-4-3.5c-.3-.5.3-.5.9-1.6.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.5 1.9.8 2.6.9 3.6.7.6-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4l-.8-.5zM12 2a10 10 0 0 0-8.6 15l-1.4 5 5.2-1.4A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>',
  fb:'<svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3c-2.8 0-4.5 1.8-4.5 4.6V11H7v4h2.5v9h4v-9h3l.5-4h-3.5V8.8c0-.5.3-.8.5-.8z"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M17.8 3h3.3l-7.2 8.2L22.4 21h-6.6l-5.2-6.8L4.7 21H1.4l7.7-8.8L1 3h6.8l4.7 6.2zm-1.2 16h1.8L7.5 4.9H5.6z"/></svg>',
  ig:'<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zM17.3 5.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zM21.9 7.1c-.1-1.6-.4-3-1.6-4.2S17.6 1.3 16 1.2C14.3 1.1 9.7 1.1 8 1.2c-1.6.1-3 .4-4.2 1.6S2.2 5.5 2.1 7.1C2 8.8 2 13.4 2.1 15.1c.1 1.6.4 3 1.6 4.2s2.6 1.5 4.2 1.6c1.7.1 6.3.1 8 0 1.6-.1 3-.4 4.2-1.6s1.5-2.6 1.6-4.2c.2-1.7.2-6.3.2-8zM19.8 18a3.3 3.3 0 0 1-1.8 1.8c-1.3.5-4.3.4-5.9.4s-4.6.1-5.9-.4A3.3 3.3 0 0 1 4.4 18c-.5-1.3-.4-4.3-.4-5.9s-.1-4.6.4-5.9A3.3 3.3 0 0 1 6.2 4.4c1.3-.5 4.3-.4 5.9-.4s4.6-.1 5.9.4c.8.3 1.5 1 1.8 1.8.5 1.3.4 4.3.4 5.9s.1 4.6-.4 5.9z"/></svg>',
  yt:'<svg viewBox="0 0 24 24"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1c.4-1.6.5-3.2.5-4.8s-.1-3.2-.5-4.8zM9.8 15V9l5.7 3z"/></svg>'
};
const KOLAM = '<svg class="kolam" viewBox="0 0 200 200" fill="none" stroke="#fff" stroke-width="2"><circle cx="100" cy="100" r="90"/><circle cx="100" cy="100" r="60"/><path d="M100 10 Q130 70 190 100 Q130 130 100 190 Q70 130 10 100 Q70 70 100 10Z"/><path d="M36 36 Q100 80 164 36 Q120 100 164 164 Q100 120 36 164 Q80 100 36 36Z"/><g fill="#fff">'+
  [...Array(5)].map((_,i)=>[...Array(5)].map((_,j)=>`<circle cx="${40+i*30}" cy="${40+j*30}" r="3"/>`).join('')).join('')+'</g></svg>';

/* ---------- language helpers ---------- */
let lang = 'en';
try {
  const saved = localStorage.getItem('mts-lang');
  if (saved === 'en' || saved === 'ta') lang = saved;
  else if ((navigator.language || '').toLowerCase().startsWith('ta')) lang = 'ta';
} catch (e) {}
const L = v => (v && typeof v === 'object' && !Array.isArray(v)) ? (v[lang] ?? v.en) : v;   // pick current language
const O = v => (v && typeof v === 'object') ? (v[lang === 'en' ? 'ta' : 'en'] ?? '') : ''; // the other language
const t = k => L(TEXT[k]) ?? k;

/* ---------- fixed links ---------- */
const tel='tel:'+SITE.phone.replace(/\s/g,''), mailto='mailto:'+SITE.email, wa='https://wa.me/'+SITE.whatsapp;
document.querySelectorAll('[data-raw]').forEach(el=>el.textContent=SITE[el.dataset.raw]);
document.querySelectorAll('[data-bind="phoneLink"]').forEach(a=>a.href=tel);
document.querySelectorAll('[data-bind="emailLink"]').forEach(a=>a.href=mailto);
document.querySelectorAll('[data-bind="waLink"]').forEach(a=>{a.href=wa; if(a.classList.contains('wa-float')) a.innerHTML=ICON.wa;});
document.getElementById('yr').textContent=new Date().getFullYear();

/* ---------- slideshow (built once, text refreshed on language change) ---------- */
let cur=0,timer;
const sWrap=document.getElementById('slides'),dWrap=document.getElementById('dots');
sWrap.innerHTML=SITE.slides.map((s,i)=>`
  <div class="slide ${s.image?'':'bg'+(i%4)} ${i===0?'on':''}" ${s.image?`style="background-image:url('${s.image}')"`:''}>
    ${s.image?'':KOLAM}
    <div class="wrap"><h1></h1><p></p>
      <a href="#events" class="btn" data-t="seeEvents"></a><a href="#contact" class="btn ghost" data-t="joinUs"></a></div>
  </div>`).join('');
dWrap.innerHTML=SITE.slides.map((_,i)=>`<button class="${i===0?'on':''}" aria-label="Slide ${i+1}" onclick="show(${i})"></button>`).join('');
function show(i){
  const s=sWrap.children,d=dWrap.children;
  s[cur].classList.remove('on');d[cur].classList.remove('on');
  cur=(i+s.length)%s.length;
  s[cur].classList.add('on');d[cur].classList.add('on');
  clearInterval(timer);timer=setInterval(()=>show(cur+1),5500);
}
function go(n){show(cur+n)}
timer=setInterval(()=>show(cur+1),5500);

/* ---------- events ---------- */
const years=[...new Set(SITE.events.map(e=>e.year))].sort((a,b)=>b-a);
let curYear=years[0];
const yWrap=document.getElementById('years'),grid=document.getElementById('evGrid');
yWrap.innerHTML=years.map(y=>`<button onclick="pickYear(${y})">${y}</button>`).join('');
function pickYear(y){
  curYear=y;
  [...yWrap.children].forEach(b=>b.classList.toggle('on',+b.textContent===y));
  grid.innerHTML=SITE.events.map((e,idx)=>({e,idx})).filter(o=>o.e.year===y).map(({e,idx},k)=>`
    <article class="ev" style="animation-delay:${k*.08}s">
      <div class="cover" onclick="openLb(${idx},0)">
        ${e.photos.length?`<img src="${e.photos[0]}" alt="${L(e.title)}" loading="lazy"><span class="count">📷 ${e.photos.length} ${t('photos')}</span>`
          :`<div class="ph"><div><span>📷</span>${t('photosSoon')}</div></div>`}
      </div>
      <div class="body">
        <div class="meta">${L(e.date)} · ${L(e.venue)}</div>
        <h3>${L(e.title)}</h3><p>${L(e.text)}</p>
        ${e.photos.length?`<button class="view" onclick="openLb(${idx},0)">${t('viewGallery')}</button>`:''}
      </div>
    </article>`).join('');
}

/* ---------- render everything in the current language ---------- */
function render(){
  document.documentElement.lang = lang;
  document.title = L(SITE.name) + ' | ' + O(SITE.name);
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));

  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll('[data-site]').forEach(el=>el.textContent=L(SITE[el.dataset.site]));
  document.querySelectorAll('[data-site-other]').forEach(el=>el.textContent=O(SITE[el.dataset.siteOther]));

  [...sWrap.children].forEach((el,i)=>{
    el.querySelector('h1').textContent=L(SITE.slides[i].title);
    el.querySelector('p').textContent=L(SITE.slides[i].text);
  });

  const socials=[
    {k:'fb',url:SITE.facebook,label:t('facebook')},{k:'x',url:SITE.twitter,label:t('twitter')},
    {k:'wa',url:wa,label:t('whatsapp')},{k:'mail',url:mailto,label:t('emailUs')},
    {k:'ig',url:SITE.instagram,label:t('instagram')},{k:'yt',url:SITE.youtube,label:t('youtube')}
  ].filter(s=>s.url);
  document.querySelectorAll('[data-social]').forEach(box=>{
    box.innerHTML=socials.map(s=>`<a href="${s.url}" ${s.k==='mail'?'':'target="_blank" rel="noopener"'} aria-label="${s.label}" title="${s.label}">${ICON[s.k]}</a>`).join('');
  });

  const cards=[
    {c:'c-phone',i:'phone',t:t('callUs'),v:SITE.phone,u:tel},
    {c:'c-mail',i:'mail',t:t('emailUs'),v:SITE.email,u:mailto},
    {c:'c-wa',i:'wa',t:t('whatsapp'),v:t('chatUs'),u:wa},
    {c:'c-fb',i:'fb',t:t('facebook'),v:t('fbSub'),u:SITE.facebook},
    {c:'c-x',i:'x',t:t('twitter'),v:t('xSub'),u:SITE.twitter},
    {c:'c-ig',i:'ig',t:t('instagram'),v:t('igSub'),u:SITE.instagram},
    {c:'c-yt',i:'yt',t:t('youtube'),v:t('ytSub'),u:SITE.youtube}
  ].filter(x=>x.u);
  document.getElementById('cards').innerHTML=cards.map(x=>
    `<a class="card" href="${x.u}" ${x.u.startsWith('http')?'target="_blank" rel="noopener"':''}><div class="ci ${x.c}">${ICON[x.i]}</div><div><small>${x.t}</small><b>${x.v}</b></div></a>`).join('');

  const sel=document.getElementById('fs'), idx=Math.max(0,sel.selectedIndex);
  sel.innerHTML=t('subjects').map(s=>`<option>${s}</option>`).join('');
  sel.selectedIndex=idx;

  pickYear(curYear);
  if (lb.classList.contains('open')) lbShow(lbI);
}

function setLang(l){
  if (l===lang) return;
  lang=l;
  try { localStorage.setItem('mts-lang', l); } catch (e) {}
  document.body.classList.add('switching');
  setTimeout(()=>{ render(); document.body.classList.remove('switching'); },180);
}

function sendMail(e){
  e.preventDefault();
  const v=id=>document.getElementById(id).value;
  const body=`${t('fName')}: ${v('fn')}\n${t('fEmail')}: ${v('fe')}\n${t('fPhone')}: ${v('fp')}\n\n${v('fm')}`;
  location.href=`${mailto}?subject=${encodeURIComponent(v('fs')+' – website')}&body=${encodeURIComponent(body)}`;
  return false;
}

/* ---------- lightbox ---------- */
let lbEv=null,lbI=0;
const lb=document.getElementById('lb');
function openLb(idx,i){
  const e=SITE.events[idx]; if(!e.photos.length) return;
  lbEv=e; lbI=i;
  document.getElementById('lbThumbs').innerHTML=e.photos.map((p,j)=>`<img src="${p}" onclick="lbShow(${j})" alt="">`).join('');
  lb.classList.add('open'); lbShow(i);
}
function lbShow(i){
  const n=lbEv.photos.length; lbI=(i+n)%n;
  document.getElementById('lbImg').src=lbEv.photos[lbI];
  document.getElementById('lbCap').textContent=`${L(lbEv.title)} · ${L(lbEv.date)}  (${lbI+1} / ${n})`;
  [...document.getElementById('lbThumbs').children].forEach((t,j)=>t.classList.toggle('on',j===lbI));
}
function lbGo(n){lbShow(lbI+n)}
function closeLb(){lb.classList.remove('open')}
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('open')) return;
  if(e.key==='Escape') closeLb(); if(e.key==='ArrowRight') lbGo(1); if(e.key==='ArrowLeft') lbGo(-1);
});
lb.addEventListener('click',e=>{if(e.target===lb) closeLb()});

/* ---------- stats + active menu ---------- */
document.querySelector('[data-count="events"]').textContent=SITE.events.length+'+';
document.querySelector('[data-count="years"]').textContent=years.length;
const links=[...document.querySelectorAll('.menu a')];
links.forEach(a=>a.addEventListener('click',()=>document.querySelector('.menu').classList.remove('open')));
const io=new IntersectionObserver(es=>es.forEach(en=>{
  if(en.isIntersecting) links.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+en.target.id));
}),{rootMargin:'-45% 0px -50% 0px'});
['home','about','events','contact'].forEach(id=>io.observe(document.getElementById(id)));

render();
</script>
</body>
</html>
